# content-researcher 配置檔
# 用於 Hermes 自動提議主題的參數設定

# 品牌關鍵字白名單 — 提議主題必須包含至少一個關鍵字
brand_keywords:
  - "AI"
  - "Agent"
  - "醫療"
  - "產品管理"
  - "循環經濟"
  - "永續"

# 自動提議設定
auto_propose:
  enabled: true
  default_interval: 7d
  dynamic_adjust: true  # 根據知識庫更新頻率動態調整提議頻率

# 社群熱點過期天數
trend_expiry_days: 7

# 平台支援
supported_platforms:
  - "hugo"
  - "x-thread"
  - "linkedin"

# 社群快報設定（Social Pulse）
social_pulse:
  enabled: true
  auto_interval: 6h
  # Discord 通知
  discord_notify: true
  discord:
    # DM：需要使用者互動、回應的通知（社群快報、主題提議、日記提醒等）
    dm:
      - "社群快報（精簡版）"
      - "主題提議通知"
    # Channel：純廣播、不需互動的通知
    channel:
      - "系統狀態（上線/離線通知）"
  # 手動查詢預設時間
  default_lookback: 30d
  # 平台啟用
  platforms:
    always:
      - "ptt"
      - "threads"
      - "reddit"
      - "x"
      - "hackernews"
      - "github"
      - "aihot"
      - "web"
    optional:
      - "bluesky"
      - "linkedin"
      - "youtube"
      - "tiktok"
      - "polymarket"
      - "arxiv"
      - "techmeme"