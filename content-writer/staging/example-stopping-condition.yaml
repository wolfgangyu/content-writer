# 研究報告：Stopping Condition

## 主題摘要

這篇文章探討 AI agent 自動化迴圈中「stopping condition」的重要性。核心論點：沒有真實 stopping condition 的迴圈不會爆炸，它只會靜悄悄地浪費 token 和時間。文章提供三種 stopping condition 模式、反方觀點（探索型任務不需要），以及實作檢查清單。

## 受眾分析

- **主要受眾**：使用 Claude Code / Hermes Agent 進行自動化工作的開發者
- **他們的現況**：已經會設定 /loop 和 automations，但遇到迴圈失控或無效運作的經驗
- **他們會分享的動機**：這是一個多數人踩過的坑，分享這個可以幫別人省時間
- **他們想聽的聲音**：實用導向，不要理論，要具體可執行的 stopping condition 設計方法

## 關鍵數據 / 引用

1. **Loop Engineering 四條件測試** 中沒有明確列出 stopping condition，這是框架的盲點
2. **Karpathy 的 LLM Wiki** 中，探索型任務（Q&A、Lint）不設 stopping condition，但執行型任務需要
3. **Token budget** 是最常見的 stopping condition，但通常設得太高

## 建議大綱

```
1. 引言：你以為在跑迴圈，其實在空轉（故事開場：一個靜悄悄浪費 token 的 loop）
2. 什麼是 stopping condition？（三個問題：做完了嗎？做好了嗎？還要繼續嗎？）
3. 三種 stopping condition 模式（數量型 / 質量型 / 混合型）
4. 反方：探索型任務不需要 stopping condition
5. 實作：在你的 loop 中加 stopping condition（檢查清單）
6. 結語：設計 stopping condition 是 loop engineering 的最後一塊拼圖
```

## 潛在論點與反方

- **潛在質疑**：「我已經用時間當 stopping condition 了啊」
  - **回應**：時間是 stopping condition，但它是懶惰版本。時間 vs 狀態檢查的區別在於：時間不關心任務有沒有真的做完

- **潛在質疑**：「太複雜的 stopping condition 不如不用 loop」
  - **回應**：是的，如果 stopping condition 比任務本身還難設計，那這個任務不適合自動化。這本身就是一個有用的篩選器

